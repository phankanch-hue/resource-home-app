<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หลังบ้าน Resource Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14211c;--muted:#5b6862;--paper:#eef1ed;--slip:#fcfdfb;--line:#d5dcd6;--glass:#0d3a32;--amber:#f3b63f;--amber-ink:#2b1d00;--pos:#17724a;--neg:#a8352b;--tab:64px}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid #1c5c4e;outline-offset:2px}
#app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 24px)}
.top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
.top h1{flex:1;margin:0;font-size:19px;font-weight:600}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--amber);color:var(--amber-ink);font-weight:600;font-size:17px}
.btn:disabled{background:#d9ddd8;color:#7c867f}.btn.g{background:transparent;border:1px solid #b9c3bb;color:var(--ink);font-weight:500}
.btn.s{min-height:38px;font-size:14px;border-radius:10px;width:auto;padding:0 14px}.btn.d{background:#f3d9d5;color:#8a2b22}
.sec{margin:22px 16px 8px;font-size:16px;font-weight:600}.pad{margin:0 16px}.empty,.hint{margin:8px 16px;color:var(--muted);font-size:14px}
.rows{margin:0 16px;background:var(--slip);border:1px solid var(--line);border-radius:14px}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left;background:none;border:0}
.row+.row{border-top:1px solid var(--line)}.row .main{flex:1;min-width:0}.row .t{font-weight:500}.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.row .a{font-weight:600;white-space:nowrap}
.card{margin:0 16px 12px;background:var(--slip);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.card .big{font-size:24px;font-weight:600}.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-pending{background:#fbeccb;color:#6b4a00}.st-approved{background:#dce8f7;color:#1c4585}.st-paid,.st-confirmed{background:#d6eddf;color:#13613c}.st-rejected,.st-voided,.st-cancelled{background:#e3e6e2;color:#4b554f}
.stack{display:grid;gap:12px}label{display:grid;gap:5px;font-size:14px;font-weight:500}
input,select{width:100%;padding:11px 12px;border:1px solid #b9c3bb;border-radius:10px;background:#fff;font-size:16px}
.house{margin:0 16px 14px;background:var(--glass);color:#eaf4ef;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px}
.house div{flex:1;min-width:0}.house small{color:#a9cfc3;display:block}
.bl{margin:0 16px 12px;padding:12px;background:var(--slip);border:1px solid var(--line);border-radius:14px;display:grid;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot{margin:6px 16px 12px;display:flex;justify-content:space-between;align-items:baseline;font-weight:600}.tot b{font-size:30px}
.ok{margin:16px;padding:18px;background:#d6eddf;border-radius:16px;text-align:center}.ok b{display:block;font-size:30px}
.tb{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tb::-webkit-scrollbar{display:none}
.tb button{position:relative;flex:0 0 22%;min-width:76px;height:var(--tab);border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:1.2;padding:0 2px;color:var(--muted)}
.tb button[aria-selected=true]{color:var(--glass);font-weight:600}
.tb button[aria-selected=true]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--amber);border-radius:0 0 3px 3px}
.bd{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.5);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:600px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sh h2{margin:0 0 12px;font-size:20px}.err{margin:8px 0;min-height:1.2em;color:var(--neg);font-size:14px}.sh .rows{margin:0;max-height:50vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 14px);z-index:60;max-width:90vw;padding:10px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;text-align:center}.toast.e{background:var(--neg)}
.state{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;text-align:center;max-width:420px;margin:0 auto}.state p{margin:0;color:var(--muted)}.state .btn{width:auto;padding:0 22px}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#dfe5df}
.seg{display:flex;margin:12px 16px;padding:3px;background:#e1e7e1;border-radius:12px}.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:14px;color:var(--muted)}.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
</style>
</head>
<body>

<div id="app" hidden>
  <header class="top"><h1>หลังบ้าน</h1><button class="ib" id="rf" type="button" aria-label="อัปเดตข้อมูล">↻</button></header>

    <button type="button" data-t="mem" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.4.3 4 2.3 4 4.8"/></svg><span id="tbMem">สมาชิก</span></button>
    <button type="button" data-t="pk" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h11v9H2z"/><path d="M13 9h4l3 3v3h-7z"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></svg><span id="tbPk">นัดรับ</span></button>
    <button type="button" data-t="pr" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1"/></svg><span>ราคา</span></button>

  </nav>
</div>
<div class="bd" id="dlg" hidden><div class="sh" id="dlgBody"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== ใส่ค่า (LIFF_ID ของหน้าแอดมินเป็นคนละตัวกับหน้าสมาชิก) =====
const CONFIG = {
  LIFF_ID: "2012543203-drgT1e6i",
  SUPABASE_URL: "https://ykehbrzhjrhtwoijboyp.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_auYcvKnsBnhTtiIAw4Vimg_meKPeR1R",   // ห้ามใส่ secret / service_role
  AUTH_FUNCTION: "hyper-handler",
};
// ================================================================
const $ = (id) => document.getElementById(id);
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const _rc = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...k) { return _rc.apply(this, k.flat(Infinity).filter((x) => x != null && x !== false)); };
const TABS = ["buy", "pay", "mem", "pk", "pr", "ov"];
function initialTab() {
  const q = new URLSearchParams(location.search);
  let t = q.get("tab");
  if (!t) { const m = (q.get("liff.state") || "").match(/[?&]tab=(\w+)/); if (m) t = m[1]; }
  return TABS.includes(t) ? t : null;
}
const T0 = initialTab();
const S = { rp: "today", rep: null, hq: "", user: null, allMats: [], pk: [], min: 50, mats: [], price: new Map(), villages: [], recent: [], pays: [], unlinked: [], tab: "buy" };
const B = { pickup: null, house: null, lines: [], done: null, busy: false };
const UNIT = { kg: "กก.", piece: "ชิ้น", bag: "ถุง" };
const METHOD = { cash: "เงินสด", bank_transfer: "โอนธนาคาร", promptpay: "พร้อมเพย์" };
const STATUS = { pending: "รอตรวจสอบ", approved: "อนุมัติแล้ว", paid: "จ่ายแล้ว", rejected: "ปฏิเสธ", cancelled: "สมาชิกยกเลิก", confirmed: "ยืนยันแล้ว", voided: "ยกเลิกแล้ว" };

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, ""); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return el;
}
const nf = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => Math.round((Number(n) || 0) * 100) / 100;
const baht = (n) => nf.format(money(n));
const dt = (iso) => iso ? new Date(iso).toLocaleString("th-TH", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Bangkok" }) : "";
const must = (r) => { if (r.error) throw r.error; return r.data; };
const chip = (s) => h("span", { class: "chip st-" + s, text: STATUS[s] || s });
const fld = (t, i) => h("label", null, h("span", { text: t }), i);
let tt;
function toast(m, e) { const t = $("toast"); t.textContent = m; t.className = "toast" + (e ? " e" : ""); t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 3500); }
function thErr(e) {
  const m = String((e && e.message) || e || "");
  if (/forbidden/i.test(m)) return "ไม่มีสิทธิ์ทำรายการนี้";
  if (/balance too low/i.test(m)) return "ยอดคงเหลือไม่พอสำหรับยกเลิก (สมาชิกถอนไปแล้ว) ให้ใช้ปรับยอดแทน";
  if (/no active price/i.test(m)) return "วัสดุนี้ยังไม่มีราคา";
  if (/household not active/i.test(m)) return "บ้านนี้ไม่ได้อยู่ในสถานะใช้งาน";
  if (/not a draft|already voided|only pending|only pending\/approved/i.test(m)) return "สถานะเปลี่ยนไปแล้ว กดอัปเดตแล้วลองใหม่";
  if (/ledger balance lower/i.test(m)) return "ยอดในกระเป๋าไม่พอจ่าย";
  if (/debit exceeds/i.test(m)) return "ปรับลดเกินยอดที่ถอนได้ของบ้านนี้";
  return "ไม่สำเร็จ: " + m;
}

// ----- dialog -----
let dlgDone = null;
function dlg(title, body, okLabel, getVal) {
  return new Promise((res) => {
    const er = h("p", { class: "err" });
    const done = (v) => { $("dlg").hidden = true; dlgDone = null; res(v); };
    dlgDone = done;
    const btns = [h("button", { type: "button", class: "btn g", text: "ปิด", onclick: () => done(null) })];
    if (okLabel) btns.push(h("button", { type: "button", class: "btn", text: okLabel, onclick: () => {
      const v = getVal ? getVal() : true;
      if (v && v.error) { er.textContent = v.error; return; }
      done(v);
    } }));
    $("dlgBody").replaceChildren(h("h2", { text: title }), body, er, h("div", { class: "two" }, btns));
    $("dlg").hidden = false;
  });
}
async function searchHouses(q) {
  q = (q || "").replace(/[,()%*\\]/g, " ").trim();
  let r = sb.from("households").select("id,household_code,household_name,contact_name,village").eq("status", "active").order("created_at", { ascending: false }).limit(15);
  if (q) r = r.or(`household_code.ilike.*${q}*,household_name.ilike.*${q}*,contact_name.ilike.*${q}*`);
  return must(await r);
}
function pickHouse() {
  const q = h("input", { type: "text", placeholder: "พิมพ์รหัสหรือชื่อบ้าน", autocomplete: "off" });
  const list = h("div", { class: "rows" });
  let t;
  const run = async () => {
    try {
      const r = await searchHouses(q.value);
      list.replaceChildren(...(r.length ? r.map((x) => h("button", { type: "button", class: "row", onclick: () => dlgDone && dlgDone(x) },
        h("div", { class: "main" }, h("div", { class: "t", text: x.household_code + "  " + x.household_name }), h("div", { class: "s", text: [x.contact_name, x.village].filter(Boolean).join("  ") })))) : [h("p", { class: "empty", text: "ไม่พบบ้าน" })]));
    } catch (e) { toast(thErr(e), 1); }
  };
  q.oninput = () => { clearTimeout(t); t = setTimeout(run, 250); };
  run();
  return dlg("เลือกบ้าน", h("div", { class: "stack" }, q, list), null);
}
async function newHouse(contact) {
  const n = h("input", { type: "text", maxlength: "80", placeholder: "เช่น บ้านลุงสมชาย" });
  const c = h("input", { type: "text", value: contact || "" });
  const p = h("input", { type: "tel", inputmode: "tel" });
  const v = h("select", null, [h("option", { value: "", text: "ไม่ระบุหมู่บ้าน" }), ...S.villages.map((x) => h("option", { value: x.id, text: x.village_name })), h("option", { value: "__new", text: "+ สร้างหมู่บ้านใหม่..." })]);
  const vn = h("input", { type: "text", maxlength: "60", placeholder: "ชื่อหมู่บ้านใหม่", style: "display:none" });
  v.onchange = () => { vn.style.display = v.value === "__new" ? "" : "none"; };
  const a = h("input", { type: "text", placeholder: "เช่น ใกล้วัด ซอย 3" });
  const f = await dlg("สร้างบ้านใหม่", h("div", { class: "stack" }, fld("ชื่อบ้าน", n), fld("ผู้ติดต่อ", c), fld("เบอร์โทร", p), fld("หมู่บ้าน", v), vn, fld("หมายเหตุที่อยู่", a)), "สร้างบ้าน",
    () => !n.value.trim() ? { error: "กรอกชื่อบ้าน" } : v.value === "__new" && !vn.value.trim() ? { error: "กรอกชื่อหมู่บ้านใหม่" } : { name: n.value.trim(), contact: c.value.trim(), phone: p.value.trim(), village: v.value || null, vname: vn.value.trim(), note: a.value.trim() });
  if (!f) return null;
  if (f.village === "__new") {
    const vr = await sb.rpc("create_village", { p_name: f.vname });
    if (vr.error) { console.error(vr.error); toast(thErr(vr.error), 1); return null; }
    f.village = vr.data;
  }
  const { data, error } = await sb.rpc("create_household", { p_name: f.name, p_contact: f.contact, p_phone: f.phone, p_village_id: f.village, p_address_note: f.note });
  if (error) { console.error(error); toast(thErr(error), 1); return null; }
  toast("สร้างบ้าน " + data.household_code + " แล้ว");
  return data;
}

// ----- auth + data -----
function showState(...n) { $("app").hidden = true; const s = $("state"); s.hidden = false; s.replaceChildren(...n.flat().filter(Boolean)); }
function showFail(t, d, label, fn) { showState(h("h2", { text: t }), d ? h("p", { text: d }) : null, label ? h("button", { class: "btn", type: "button", text: label, onclick: fn }) : null); }
function relogin() { try { liff.logout(); } catch (e) { /* ignore */ } liff.login({ redirectUri: location.href }); }
async function authenticate() {
  if (String(CONFIG.LIFF_ID).startsWith("ใส่") || String(CONFIG.SUPABASE_ANON_KEY).startsWith("ใส่")) throw new Error("ยังไม่ได้ใส่ LIFF_ID หรือ SUPABASE_ANON_KEY ใน CONFIG");
  await liff.init({ liffId: CONFIG.LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return null; }
  const dec = liff.getDecodedIDToken();
  const { data: { session } } = await sb.auth.getSession();
  if (session && dec && session.user?.user_metadata?.line_user_id === dec.sub) return session.user;
  const idToken = liff.getIDToken();
  if (!idToken) { relogin(); return null; }
  const res = await fetch(CONFIG.SUPABASE_URL + "/functions/v1/" + CONFIG.AUTH_FUNCTION, { method: "POST",
    headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: "Bearer " + CONFIG.SUPABASE_ANON_KEY }, body: JSON.stringify({ id_token: idToken }) });
  const out = await res.json().catch(() => ({}));
  if (res.status === 401) { const e = new Error("auth_expired"); e.code = "auth_expired"; throw e; }
  if (!res.ok || !out.token_hash) throw new Error("auth: " + (out.error || res.status));
  const { data, error } = await sb.auth.verifyOtp({ token_hash: out.token_hash, type: "magiclink" });
  if (error) throw error;
  return data.user;
}
async function loadAll() {
  const [mats, prices, vil, rec, pays, unl, pk, set] = await Promise.all([
    sb.from("materials").select("id,material_name,unit,is_active").order("material_name"),
    sb.from("material_prices").select("material_id,buy_price").is("effective_to", null),
    sb.from("villages").select("id,village_name").eq("is_active", true).order("village_code"),
    sb.from("purchase_transactions").select("id,receipt_no,status,gross_total,confirmed_at,created_at,households(household_code,household_name)").in("status", ["confirmed", "voided"]).order("created_at", { ascending: false }).limit(12),
    sb.from("payout_requests").select("id,amount,payout_method,payout_reference,status,requested_at,staff_note,households(household_code,household_name)").order("requested_at", { ascending: false }).limit(40),

    try {

      let r = sb.from("households").select("id,household_code,household_name,village,status").order("household_code", { ascending: false }).limit(20);
      if (q) r = r.or(`household_code.ilike.*${q}*,household_name.ilike.*${q}*,contact_name.ilike.*${q}*`);
      const d = must(await r);
      hl.replaceChildren(d.length ? d.map((x) => h("button", { class: "row", type: "button", onclick: () => houseDetail(x.id) },
        h("div", { class: "main" }, h("div", { class: "t", text: x.household_code + "  " + x.household_name }), h("div", { class: "s", text: x.village || "" })),
        x.status !== "active" ? h("span", { class: "chip st-voided", text: "ระงับ" }) : null)) : h("p", { class: "empty", text: "ไม่พบบ้าน" }));
    } catch (e) { toast(thErr(e), 1); }

  const v = await dlg("ปรับยอด " + hh.household_code, h("div", { class: "stack" }, fld("จำนวนเงิน (+ เพิ่ม / - ลด)", a), fld("เหตุผล (สมาชิกจะเห็น)", why)), "ยืนยันปรับยอด",
    () => { const x = parseFloat(a.value); return !x ? { error: "ใส่จำนวนเงินที่ไม่ใช่ 0" } : !why.value.trim() ? { error: "ต้องใส่เหตุผล" } : { x, why: why.value.trim() }; });

async function houseDetail(id) {
  for (;;) {
    let hh, bal, mem, pur, pay;
    try {
      [hh, bal, mem, pur, pay] = (await Promise.all([
        sb.from("households").select("id,household_code,household_name,contact_name,phone,village,status").eq("id", id).single(),
        sb.from("wallet_balances").select("*").eq("household_id", id).maybeSingle(),
        sb.from("profiles").select("id,display_name").eq("household_id", id),
        sb.from("purchase_transactions").select("receipt_no,status,gross_total").eq("household_id", id).in("status", ["confirmed", "voided"]).order("created_at", { ascending: false }).limit(5),
        sb.from("payout_requests").select("amount,status,requested_at").eq("household_id", id).order("requested_at", { ascending: false }).limit(5),
      ])).map((r) => must(r));
    } catch (e) { console.error(e); toast(thErr(e), 1); return; }
    const b = bal || {};
    const act = (a, t, cls, extra) => h("button", { class: "btn s " + cls, type: "button", text: t, onclick: () => dlgDone && dlgDone({ a, ...extra }) });
    const body = h("div", { class: "stack" },
      h("div", { class: "s", text: [hh.contact_name, hh.phone, hh.village].filter(Boolean).join("  ") }),
      h("div", { class: "card", style: "margin:0" }, h("div", { class: "hd", text: "ยอดที่ถอนได้" }), h("div", { class: "big num", text: "฿" + baht(b.available_balance) }),
        h("div", { class: "s", text: `สะสม ฿${baht(b.total_earned)}  รับแล้ว ฿${baht(b.total_paid)}  รอจ่าย ฿${baht(b.reserved_amount)}` })),
      h("div", { class: "acts", style: "margin:0" }, act("adjust", "ปรับยอด", ""), act("status", hh.status === "active" ? "ระงับบ้าน" : "เปิดใช้งานบ้าน", "g")),
      h("b", { text: "สมาชิก LINE ที่ผูกอยู่" }),
      mem.length ? mem.map((m) => h("div", { class: "row", style: "padding:6px 0" }, h("div", { class: "main", text: m.display_name || "(ไม่มีชื่อ)" }), act("unlink", "ยกเลิกผูก", "d", { pid: m.id }))) : h("div", { class: "s", text: "ยังไม่มีสมาชิกผูกอยู่" }),
      h("b", { text: "รับซื้อล่าสุด" }), pur.length ? pur.map((p) => h("div", { class: "s num", text: `${p.receipt_no}  ฿${baht(p.gross_total)}  ${STATUS[p.status]}` })) : h("div", { class: "s", text: "ยังไม่มี" }),
      h("b", { text: "รับเงินล่าสุด" }), pay.length ? pay.map((p) => h("div", { class: "s num", text: `${dt(p.requested_at)}  ฿${baht(p.amount)}  ${STATUS[p.status]}` })) : h("div", { class: "s", text: "ยังไม่มี" }));
    const r = await dlg(hh.household_code + "  " + hh.household_name, body, null);
    if (!r) return;
    if (r.a === "adjust") await adjustDlg(hh);
    else if (r.a === "status") {
      const { error } = await sb.from("households").update({ status: hh.status === "active" ? "inactive" : "active" }).eq("id", id);
      if (error) { toast(thErr(error), 1); } else { toast("บันทึกแล้ว"); await refresh(); }
    } else if (r.a === "unlink") {
      if (await dlg("ยกเลิกผูกสมาชิก", h("p", { text: "ยกเลิกการผูกบัญชี LINE นี้กับบ้านนี้?" }), "ยืนยัน", () => true)) {
        const { error } = await sb.rpc("link_member_household", { p_profile_id: r.pid, p_household_id: null });
        if (error) toast(thErr(error), 1); else { toast("ยกเลิกผูกแล้ว"); await refresh(); }
      }
    }
  }
}

// ----- overview -----
function range(k) {
  const day = 864e5, bk = (x) => new Date(x + "T00:00:00+07:00");
  const today = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });
  const [y, m] = today.split("-").map(Number), t0 = bk(today);
  const mm = (yy, mo) => bk(yy + "-" + String(mo).padStart(2, "0") + "-01");
  if (k === "today") return [t0, new Date(+t0 + day)];
  if (k === "7d") return [new Date(+t0 - 6 * day), new Date(+t0 + day)];
  if (k === "month") return [mm(y, m), m === 12 ? mm(y + 1, 1) : mm(y, m + 1)];
  return [m === 1 ? mm(y - 1, 12) : mm(y, m - 1), mm(y, m)];
}
async function loadReport() {
  const [f, t] = range(S.rp);
  S.rep = null; renderOv();
  const { data, error } = await sb.rpc("report_summary", { p_from: f.toISOString(), p_to: t.toISOString() });
  if (error) { console.error(error); toast(thErr(error), 1); return; }
  S.rep = data; renderOv();
}

function renderAll() { renderBuy(); renderPay(); renderMem(); renderPk(); renderPr(); renderOv(); }
function showTab(t) {
  S.tab = t;
  document.querySelectorAll(".tb button").forEach((b) => { const on = b.dataset.t === t; b.setAttribute("aria-selected", String(on)); if (on) { const nav = b.parentElement; nav.scrollTo({ left: b.offsetLeft - (nav.clientWidth - b.offsetWidth) / 2, behavior: "smooth" }); } });
  ["buy", "pay", "mem", "pk", "pr", "ov"].forEach((k) => { $("tab-" + k).hidden = k !== t; });
  if (t === "ov") loadReport();
  window.scrollTo(0, 0);
}
async function start() {
  showState(h("p", { text: "กำลังเปิดหลังบ้าน..." }));
  try {
    if (!S.user) { const u = await authenticate(); if (!u) return; S.user = u; }
    const r = must(await sb.from("user_roles").select("role").eq("user_id", S.user.id).maybeSingle());
    if (!r || r.role !== "admin") { showFail("บัญชีนี้ไม่มีสิทธิ์เข้าหน้านี้", "ต้องเป็นผู้ดูแล (admin)", null); return; }
    await loadAll();
    $("state").hidden = true; $("app").hidden = false; showTab(T0 || initialTab() || S.tab);
  } catch (e) {
    console.error(e);
    if (e && e.code === "auth_expired") showFail("ล็อกอินหมดอายุ", "เปิดผ่าน LINE ใหม่อีกครั้ง", "ล็อกอิน LINE ใหม่", relogin);
    else showFail("เปิดไม่สำเร็จ", e && e.message ? e.message : "", "ลองใหม่", start);
  }
}
document.querySelectorAll(".tb button").forEach((b) => { b.onclick = () => showTab(b.dataset.t); });
