<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กระเป๋าสมาชิก Resource Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14211c;
    --muted: #5b6862;
    --paper: #eef1ed;
    --slip: #fcfdfb;
    --line: #d5dcd6;
    --glass: #0d3a32;
    --glass-hi: #1c5c4e;
    --amber: #f3b63f;
    --amber-ink: #2b1d00;
    --pos: #17724a;
    --neg: #a8352b;
    --tab-h: 62px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--glass-hi); outline-offset: 2px; }

  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px); }

  /* header */
  .top { display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; }
  .top .who { flex: 1; min-width: 0; }
  .top h1 { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top p { margin: 0; font-size: 13px; color: var(--muted); }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; }

  /* balance panel */
  .panel { margin: 4px 16px 0; background: var(--glass); color: #eaf4ef; border-radius: 20px; padding: 20px 20px 0; overflow: hidden; }
  .panel .lbl { font-size: 14px; color: #a9cfc3; }
  .panel .big { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
  .panel .cur { font-size: 24px; color: #a9cfc3; }
  .panel .amt { font-size: clamp(44px, 15vw, 64px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .stats { display: flex; margin: 16px -20px 0; border-top: 1px solid rgba(255,255,255,.14); }
  .stats > div { flex: 1; padding: 12px 20px 14px; min-width: 0; }
  .stats > div + div { border-left: 1px solid rgba(255,255,255,.14); }
  .stats .k { font-size: 12px; color: #a9cfc3; }
  .stats .v { font-size: 16px; font-weight: 500; }
  .ruler {
    height: 12px; margin: 0 -20px;
    background-image:
      linear-gradient(90deg, rgba(255,255,255,.38) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.2) 1px, transparent 1px);
    background-size: 40px 12px, 8px 6px;
    background-position: 0 100%, 0 100%;
    background-repeat: repeat-x;
  }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 52px; border: 0; border-radius: 14px;
    background: var(--amber); color: var(--amber-ink); font-weight: 600; font-size: 17px;
  }
  .btn:disabled { background: #d9ddd8; color: #7c867f; cursor: not-allowed; }
  .btn.ghost { background: transparent; border: 1px solid #b9c3bb; color: var(--ink); font-weight: 500; }
  .btn.small { min-height: 38px; font-size: 14px; border-radius: 10px; width: auto; padding: 0 14px; }
  .cta { margin: 14px 16px 0; width: calc(100% - 32px); }
  .note { margin: 8px 16px 0; font-size: 13px; color: var(--muted); }

  .sec { margin: 26px 16px 8px; font-size: 16px; font-weight: 600; }
  .empty { margin: 8px 16px; color: var(--muted); font-size: 14px; }

  /* list rows */
  .rows { margin: 0 16px; background: var(--slip); border: 1px solid var(--line); border-radius: 14px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .main { flex: 1; min-width: 0; }
  .row .t { font-weight: 500; }
  .row .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .row .a { font-weight: 600; white-space: nowrap; }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }

  /* weighing-slip look for history */
  .slip { margin: 0 16px 14px; background: var(--slip); border-top: 2px dashed var(--line); border-bottom: 2px dashed var(--line); padding: 12px 14px; }
  .slip.void { opacity: .65; }
  .slip.void .total span:last-child { text-decoration: line-through; }
  .slip .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .line { display: flex; align-items: baseline; gap: 6px; padding: 3px 0; }
  .line > span:first-child { overflow-wrap: anywhere; }
  .line .lead { flex: 1; min-width: 12px; border-bottom: 1px dotted #9aa59e; transform: translateY(-3px); }
  .slip .total { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--ink); font-weight: 600; }
  .slip .money { font-size: 24px; font-weight: 600; }
  .slip .msg { margin-top: 8px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .slip .act { margin-top: 10px; }

  .chip { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .st-pending, .st-requested { background: #fbeccb; color: #6b4a00; }
  .st-approved, .st-scheduled { background: #dce8f7; color: #1c4585; }
  .st-paid, .st-completed { background: #d6eddf; color: #13613c; }
  .st-rejected { background: #f3d9d5; color: #8a2b22; }
  .st-cancelled { background: #e3e6e2; color: #4b554f; }

  .seg { display: flex; margin: 0 16px 16px; padding: 3px; background: #e1e7e1; border-radius: 12px; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 9px 0; font-weight: 500; color: var(--muted); }
  .seg button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }

  /* forms */
  .form { margin: 0 16px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 14px; font-weight: 500; }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #b9c3bb; border-radius: 10px; background: #fff; font-size: 16px; }
  textarea { resize: vertical; }
  .err { margin: 0; min-height: 1.2em; color: var(--neg); font-size: 14px; }
  .hint { margin: 0; color: var(--muted); font-size: 14px; }
  .pagehead { margin: 4px 16px 14px; }
  .pagehead h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .pagehead p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }

  /* tab bar */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar .in { display: flex; max-width: 560px; margin: 0 auto; }
  .tabbar button { position: relative; flex: 1; height: var(--tab-h); border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); }
  .tabbar button[aria-selected="true"] { color: var(--glass); font-weight: 600; }
  .tabbar button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; background: var(--amber); border-radius: 0 0 3px 3px; }

  /* sheets */
  .backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(10,20,16,.5); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: #fff; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 14px; animation: up .2s ease-out; }
  .sheet h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .sheet .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .amtrow { display: flex; gap: 8px; }
  .amtrow input { flex: 1; }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px); z-index: 60; max-width: 90vw; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 14px; text-align: center; }
  .toast.err { background: var(--neg); }

  .state { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; max-width: 420px; margin: 0 auto; }
  .state h2 { margin: 0; font-size: 20px; }
  .state p { margin: 0; color: var(--muted); }
  .state .detail { font-size: 12px; overflow-wrap: anywhere; }
  .state img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
  .state .btn { width: auto; padding: 0 22px; }
</style>
</head>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== ใส่ค่าให้ครบ (คัดลอกจาก liff_test.html ได้เลย) =====
const CONFIG = {
  LIFF_ID: "2012543203-KKTAUn1Y",
  SUPABASE_URL: "https://ykehbrzhjrhtwoijboyp.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_auYcvKnsBnhTtiIAw4Vimg_meKPeR1R",   // ห้ามใส่ secret / service_role
  AUTH_FUNCTION: "hyper-handler",
};
// ==========================================================

const $ = (id) => document.getElementById(id);
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

const TABS = ["wallet", "history", "prices", "pickup"];
function initialTab() {
  const q = new URLSearchParams(location.search);
  let t = q.get("tab");
  if (!t) { const m = (q.get("liff.state") || "").match(/[?&]tab=(\w+)/); if (m) t = m[1]; }
  return TABS.includes(t) ? t : null;
}
const T0 = initialTab();
const state = {
  user: null, profile: null, hh: null, bal: null, min: 50,
  ledger: [], purchases: [], payouts: [], mats: [], prices: [], pickups: [],
  tab: "wallet", hseg: "purchases",
};

// ---------- helpers ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === false || v == null) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const nf = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const wf = new Intl.NumberFormat("en-US", { maximumFractionDigits: 3 });
const money = (n) => Math.round((Number(n) || 0) * 100) / 100;
const baht = (n) => nf.format(money(n));
const TZ = "Asia/Bangkok";
const dfmt = (iso) => iso ? new Date(iso).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit", timeZone: TZ }) : "";
const tfmt = (iso) => iso ? new Date(iso).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ }) : "";
const UNIT = { kg: "กก.", piece: "ชิ้น", bag: "ถุง" };
const METHOD = { cash: "เงินสด", bank_transfer: "โอนธนาคาร", promptpay: "พร้อมเพย์" };
const PAY_STATUS = { pending: "รอตรวจสอบ", approved: "อนุมัติแล้ว รอจ่าย", paid: "จ่ายแล้ว", rejected: "ไม่อนุมัติ", cancelled: "ยกเลิกแล้ว" };
const PICK_STATUS = { requested: "รอยืนยัน", scheduled: "นัดหมายแล้ว", completed: "เสร็จสิ้น", cancelled: "ยกเลิก" };
const PICK_TIMES = ["ช่วงเช้า (08:00-12:00)", "ช่วงบ่าย (13:00-17:00)", "ไม่ระบุเวลา"];
const must = (r) => { if (r.error) throw r.error; return r.data; };
const chip = (status, label) => h("span", { class: "chip st-" + status, text: label });
const maskRef = (ref) => {
  if (!ref) return "";
  const d = String(ref).replace(/\D/g, "");
  return d.length >= 4 ? "•••• " + d.slice(-4) : "";
};

let toastTimer;
function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " err" : "");
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}
function friendly(msg) {
  const m = String(msg || "");
  if (/minimum payout/i.test(m)) return "จำนวนเงินต่ำกว่าขั้นต่ำที่ถอนได้";
  if (/exceeds available/i.test(m)) return "จำนวนเงินเกินยอดที่ถอนได้";
  if (/not linked/i.test(m)) return "บัญชียังไม่ได้ผูกกับบ้าน";
  if (/not active/i.test(m)) return "บัญชีบ้านนี้ถูกระงับ ติดต่อเจ้าหน้าที่";
  if (/only pending/i.test(m)) return "รายการนี้เปลี่ยนสถานะแล้ว ยกเลิกไม่ได้";
  return "ทำรายการไม่สำเร็จ ลองใหม่อีกครั้ง";
}
function askConfirm(text, okLabel) {
  return new Promise((resolve) => {
    $("cfText").textContent = text;
    $("cfOk").textContent = okLabel;
    $("confirm").hidden = false;
    const done = (v) => { $("confirm").hidden = true; $("cfOk").onclick = null; $("cfNo").onclick = null; resolve(v); };
    $("cfOk").onclick = () => done(true);
    $("cfNo").onclick = () => done(false);
  });
}

// ---------- screens ----------
function showState(...nodes) {
  $("app").hidden = true;
  const s = $("state");
  s.hidden = false;
  s.replaceChildren(...nodes.flat().filter(Boolean));
}
function showApp() { $("state").hidden = true; $("app").hidden = false; }
function showFail(title, detail, label, fn) {
  showState(
    h("h2", { text: title }),
    detail ? h("p", { class: "detail", text: detail }) : null,
    h("button", { class: "btn", type: "button", text: label, onclick: fn })
  );
}
function relogin() {
  try { liff.logout(); } catch (e) { /* ignore */ }
  liff.login({ redirectUri: location.href });
}
function showTab(name) {
  state.tab = name;
  document.querySelectorAll(".tabbar button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  document.querySelectorAll(".tab").forEach((s) => { s.hidden = s.id !== "tab-" + name; });
  window.scrollTo(0, 0);
}

// ---------- auth ----------
async function authenticate() {
  if (String(CONFIG.LIFF_ID).startsWith("ใส่") || String(CONFIG.SUPABASE_ANON_KEY).startsWith("ใส่")) {
    throw new Error("ยังไม่ได้ใส่ LIFF_ID หรือ SUPABASE_ANON_KEY ใน CONFIG");
  }
  await liff.init({ liffId: CONFIG.LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return null; }

  const decoded = liff.getDecodedIDToken();
  const { data: { session } } = await sb.auth.getSession();
  if (session && decoded && session.user?.user_metadata?.line_user_id === decoded.sub) return session.user;

  const idToken = liff.getIDToken();
  if (!idToken) { relogin(); return null; }

  const res = await fetch(CONFIG.SUPABASE_URL + "/functions/v1/" + CONFIG.AUTH_FUNCTION, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      apikey: CONFIG.SUPABASE_ANON_KEY,
      Authorization: "Bearer " + CONFIG.SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({ id_token: idToken }),
  });
  const out = await res.json().catch(() => ({}));
  if (res.status === 401) { const e = new Error("auth_expired"); e.code = "auth_expired"; throw e; }
  if (!res.ok || !out.token_hash) throw new Error("line-auth: " + (out.error || res.status) + (out.detail ? " (" + out.detail + ")" : ""));

  const { data, error } = await sb.auth.verifyOtp({ token_hash: out.token_hash, type: "magiclink" });
  if (error) throw error;
  return data.user;
}

// ---------- data ----------
async function loadProfile() {
  state.profile = must(await sb.from("profiles").select("display_name,picture_url,household_id").eq("id", state.user.id).single());
}
async function loadAll() {
  const hid = state.profile.household_id;
  const [hh, bal, set, led, pur, pay, mats, prices, pick] = await Promise.all([
    sb.from("households").select("household_name,household_code,status,village,villages(village_name)").eq("id", hid).single(),
    sb.from("wallet_balances").select("*").eq("household_id", hid).maybeSingle(),
    sb.from("app_settings").select("value").eq("key", "min_payout_amount").maybeSingle(),
    sb.from("wallet_ledger").select("id,entry_type,amount,description,created_at").eq("household_id", hid).order("created_at", { ascending: false }).limit(10),
    sb.from("purchase_transactions").select("id,receipt_no,status,gross_total,confirmed_at,created_at,purchase_items(weight,unit_price,line_total,materials(material_name,unit))").eq("household_id", hid).in("status", ["confirmed", "voided"]).order("created_at", { ascending: false }).limit(30),
    sb.from("payout_requests").select("id,amount,payout_method,payout_reference,status,requested_at,processed_at,staff_note").eq("household_id", hid).order("requested_at", { ascending: false }).limit(30),
    sb.from("materials").select("id,material_name,unit").eq("is_active", true).order("material_name"),
    sb.from("material_prices").select("material_id,buy_price,effective_from").is("effective_to", null),
    sb.from("pickup_requests").select("id,requested_date,preferred_time,material_note,estimated_weight_kg,status,staff_note,created_at").eq("household_id", hid).order("created_at", { ascending: false }).limit(10),
  ]);
  state.hh = must(hh);
  state.bal = must(bal) || { total_earned: 0, total_paid: 0, reserved_amount: 0, available_balance: 0 };
  const m = Number(must(set)?.value);
  state.min = isFinite(m) && m > 0 ? m : 50;
  state.ledger = must(led) || [];
  state.purchases = must(pur) || [];
  state.payouts = must(pay) || [];
  state.mats = must(mats) || [];
  state.prices = must(prices) || [];
  state.pickups = must(pick) || [];
  renderAll();
}

// ---------- render ----------
function renderAll() {
  renderHeader();
  renderWallet();
  renderHistory();
  renderPrices();
  renderPickup();
}
function renderHeader() {
  $("hName").textContent = state.hh.household_name || "บ้านของฉัน";
  const village = state.hh.villages?.village_name || state.hh.village || "";
  $("hSub").textContent = [state.hh.household_code, village].filter(Boolean).join("  ");
}

function stat(label, value) {
  return h("div", null, h("div", { class: "k", text: label }), h("div", { class: "v num", text: "฿" + baht(value) }));
}
function renderWallet() {
  const b = state.bal;
  const avail = money(b.available_balance);
  const reserved = money(b.reserved_amount);
  const active = state.hh.status === "active";
  const canPay = active && avail >= state.min;

  let hint;
  if (!active) hint = "บัญชีบ้านนี้ถูกระงับ ติดต่อเจ้าหน้าที่";
  else if (avail < state.min) hint = `ถอนได้เมื่อมียอดอย่างน้อย ฿${baht(state.min)} (ขาดอีก ฿${baht(state.min - avail)})`;
  else if (reserved > 0) hint = `มีคำขอที่รอจ่าย ฿${baht(reserved)} หักออกจากยอดที่ถอนได้แล้ว`;
  else hint = `ขั้นต่ำ ฿${baht(state.min)} ต่อครั้ง`;

  const ledgerRows = state.ledger.map((e) => {
    const amt = Number(e.amount);
    const label = { sale_credit: "ขายวัสดุ", payout_debit: "รับเงิน", adjustment_credit: "ปรับยอด เพิ่ม", adjustment_debit: "ปรับยอด ลด", reversal: "ยกเลิกใบรับซื้อ" }[e.entry_type] || "รายการ";
    const rc = (e.description || "").match(/RH[\d-]+/);
    let sub = dfmt(e.created_at);
    if (rc) sub += "  ใบรับซื้อ " + rc[0];
    else if (e.entry_type.startsWith("adjustment") && e.description) sub += "  " + e.description;
    return h("div", { class: "row" },
      h("div", { class: "main" }, h("div", { class: "t", text: label }), h("div", { class: "s", text: sub })),
      h("div", { class: "a num " + (amt > 0 ? "pos" : "neg"), text: (amt > 0 ? "+" : "-") + "฿" + baht(Math.abs(amt)) })
    );
  });

  $("tab-wallet").replaceChildren(
    h("div", { class: "panel" },
      h("div", { class: "lbl", text: "ยอดที่ถอนได้" }),
      h("div", { class: "big" }, h("span", { class: "cur", text: "฿" }), h("span", { class: "amt num", text: baht(avail) })),
      h("div", { class: "stats" }, stat("สะสมทั้งหมด", b.total_earned), stat("รับเงินแล้ว", b.total_paid), stat("รอจ่าย", reserved)),
      h("div", { class: "ruler" })
    ),
    h("button", { class: "btn cta", type: "button", text: "ขอรับเงิน", disabled: !canPay, onclick: openPayout }),
    h("p", { class: "note", text: hint }),
    h("h2", { class: "sec", text: "ความเคลื่อนไหวล่าสุด" }),
    ledgerRows.length
      ? h("div", { class: "rows" }, ledgerRows)
      : h("p", { class: "empty", text: "ยังไม่มีรายการ เมื่อมีการรับซื้อ ยอดจะขึ้นที่นี่" })
  );
}

function segBtn(key, label) {
  return h("button", { type: "button", role: "tab", "aria-selected": String(state.hseg === key), text: label,
    onclick: () => { state.hseg = key; renderHistory(); } });
}
function purchaseSlip(p) {
  const voided = p.status === "voided";
  const lines = (p.purchase_items || []).map((it) => {
    const m = it.materials || {};
    return h("div", { class: "line" },
      h("span", { text: `${m.material_name || "วัสดุ"} ${wf.format(it.weight)} ${UNIT[m.unit] || ""} × ${baht(it.unit_price)}` }),
      h("span", { class: "lead" }),
      h("span", { class: "num", text: baht(it.line_total) })
    );
  });
  return h("article", { class: "slip" + (voided ? " void" : "") },
    h("div", { class: "hd" },
      h("span", { class: "num", text: p.receipt_no }),
      voided ? chip("cancelled", "ยกเลิกแล้ว") : h("span", { text: dfmt(p.confirmed_at || p.created_at) })
    ),
    lines,
    h("div", { class: "total" }, h("span", { text: "รวม" }), h("span", { class: "num", text: "฿" + baht(p.gross_total) }))
  );
}
function payoutSlip(p) {
  const ref = maskRef(p.payout_reference);
  return h("article", { class: "slip" },
    h("div", { class: "hd" }, h("span", { text: "ส่งคำขอ " + dfmt(p.requested_at) + " " + tfmt(p.requested_at) }), chip(p.status, PAY_STATUS[p.status] || p.status)),
    h("div", { class: "money num", text: "฿" + baht(p.amount) }),
    h("div", { class: "line" }, h("span", { text: "รับเงินทาง" }), h("span", { class: "lead" }), h("span", { text: METHOD[p.payout_method] || p.payout_method })),
    ref ? h("div", { class: "line" }, h("span", { text: "บัญชี" }), h("span", { class: "lead" }), h("span", { class: "num", text: ref })) : null,
    p.status === "paid" && p.processed_at ? h("div", { class: "line" }, h("span", { text: "จ่ายเมื่อ" }), h("span", { class: "lead" }), h("span", { text: dfmt(p.processed_at) })) : null,
    p.staff_note ? h("div", { class: "msg", text: "หมายเหตุจากเจ้าหน้าที่: " + p.staff_note }) : null,
    p.status === "pending" ? h("div", { class: "act" }, h("button", { class: "btn ghost small", type: "button", text: "ยกเลิกคำขอ", onclick: () => cancelPayout(p.id) })) : null
  );
}
function renderHistory() {
  const list = state.hseg === "purchases"
    ? (state.purchases.length ? state.purchases.map(purchaseSlip) : [h("p", { class: "empty", text: "ยังไม่มีประวัติการรับซื้อ" })])
    : (state.payouts.length ? state.payouts.map(payoutSlip) : [h("p", { class: "empty", text: "ยังไม่เคยขอรับเงิน" })]);
  $("tab-history").replaceChildren(
    h("div", { class: "seg", role: "tablist" }, segBtn("purchases", "รับซื้อ"), segBtn("payouts", "รับเงิน")),
    ...list
  );
}

function renderPrices() {
  const byMat = new Map(state.prices.map((p) => [p.material_id, p]));
  const latest = state.prices.map((p) => p.effective_from).sort().pop();
  const rows = state.mats.map((m) => {
    const p = byMat.get(m.id);
    return h("div", { class: "row" },
      h("div", { class: "main t", text: m.material_name }),
      h("div", { class: "a num", text: p ? `฿${baht(p.buy_price)} / ${UNIT[m.unit] || m.unit}` : "ยังไม่กำหนดราคา" })
    );
  });
  $("tab-prices").replaceChildren(
    h("div", { class: "pagehead" },
      h("h2", { text: "ราคารับซื้อ" }),
      h("p", { text: latest ? "อัปเดตล่าสุด " + dfmt(latest) : "ยังไม่มีราคา" })
    ),
    rows.length ? h("div", { class: "rows" }, rows) : h("p", { class: "empty", text: "ยังไม่มีรายการวัสดุ" })
  );
}

function field(text, input) { return h("label", null, h("span", { text }), input); }
function renderPickup() {
  const today = new Date().toLocaleDateString("en-CA", { timeZone: TZ });
  const fDate = h("input", { type: "date", required: true, min: today, value: today });
  const fTime = h("select", null, PICK_TIMES.map((t) => h("option", { value: t, text: t })));
  const fNote = h("textarea", { rows: "3", required: true, maxlength: "300", placeholder: "เช่น เหล็ก อลูมิเนียม กระดาษลัง" });
  const fW = h("input", { type: "number", inputmode: "decimal", min: "0", step: "0.1", placeholder: "ไม่ทราบก็เว้นว่างได้" });
  const btn = h("button", { class: "btn", type: "submit", text: "ส่งคำขอ" });

  const form = h("form", { class: "form", onsubmit: async (ev) => {
    ev.preventDefault();
    if (btn.disabled) return;
    const note = fNote.value.trim();
    if (!note) { toast("บอกด้วยว่ามีของอะไรบ้าง", true); return; }
    const w = parseFloat(fW.value);
    btn.disabled = true;
    const { error } = await sb.from("pickup_requests").insert({
      household_id: state.profile.household_id,
      requested_date: fDate.value,
      preferred_time: fTime.value,
      material_note: note,
      estimated_weight_kg: isFinite(w) && w > 0 ? w : null,
    });
    btn.disabled = false;
    if (error) { console.error(error); toast("ส่งคำขอไม่สำเร็จ ลองใหม่อีกครั้ง", true); return; }
    toast("ส่งคำขอแล้ว");
    try { await loadAll(); } catch (e) { console.error(e); }
  } },
    field("วันที่ต้องการให้ไปรับ", fDate),
    field("ช่วงเวลา", fTime),
    field("มีของอะไรบ้าง", fNote),
    field("น้ำหนักโดยประมาณ (กก.)", fW),
    btn
  );

  const past = state.pickups.map((p) => h("div", { class: "row" },
    h("div", { class: "main" },
      h("div", { class: "t", text: dfmt(p.requested_date) + "  " + (p.preferred_time || "") }),
      h("div", { class: "s", text: p.material_note || "" }),
      p.staff_note ? h("div", { class: "s", text: "หมายเหตุจากเจ้าหน้าที่: " + p.staff_note }) : null
    ),
    chip(p.status, PICK_STATUS[p.status] || p.status)
  ));

  $("tab-pickup").replaceChildren(
    h("div", { class: "pagehead" }, h("h2", { text: "นัดให้ไปรับของ" }), h("p", { text: "บอกวันและรายการ เจ้าหน้าที่จะยืนยันกลับ" })),
    form,
    h("h2", { class: "sec", text: "คำขอล่าสุด" }),
    past.length ? h("div", { class: "rows" }, past) : h("p", { class: "empty", text: "ยังไม่เคยส่งคำขอ" })
  );
}

// ---------- payout ----------
function syncMethod() {
  const m = $("pMethod").value;
  $("pRefWrap").hidden = m === "cash";
  $("pRefLabel").textContent = m === "promptpay" ? "เบอร์พร้อมเพย์หรือเลขบัตรประชาชน" : "ธนาคารและเลขบัญชี";
  $("pRef").placeholder = m === "promptpay" ? "เช่น 0812345678" : "เช่น กสิกร 123-4-56789-0";
  $("pRef").setAttribute("inputmode", m === "promptpay" ? "numeric" : "text");
}
function openPayout() {
  const avail = money(state.bal.available_balance);
  $("pAvail").textContent = `ถอนได้สูงสุด ฿${baht(avail)} ขั้นต่ำ ฿${baht(state.min)}`;
  $("pAmount").value = "";
  $("pMethod").value = "cash";
  $("pRef").value = "";
  $("pErr").textContent = "";
  syncMethod();
  $("sheet").hidden = false;
  setTimeout(() => $("pAmount").focus(), 50);
}
function closePayout() { $("sheet").hidden = true; }
async function submitPayout() {
  const err = (m) => { $("pErr").textContent = m; };
  err("");
  const avail = money(state.bal.available_balance);
  const amount = money(parseFloat(String($("pAmount").value).replace(/,/g, "")));
  if (!isFinite(amount) || amount <= 0) return err("กรอกจำนวนเงินที่ต้องการรับ");
  if (amount < state.min) return err(`ขั้นต่ำ ฿${baht(state.min)} ต่อครั้ง`);
  if (amount > avail) return err(`เกินยอดที่ถอนได้ (฿${baht(avail)})`);

  const method = $("pMethod").value;
  const raw = $("pRef").value.trim();
  const digits = raw.replace(/\D/g, "");
  let ref = null;
  if (method === "promptpay") {
    if (digits.length !== 10 && digits.length !== 13) return err("พร้อมเพย์ต้องเป็นเบอร์ 10 หลัก หรือเลขบัตร 13 หลัก");
    ref = digits;
  } else if (method === "bank_transfer") {
    if (digits.length < 10) return err("กรอกชื่อธนาคารและเลขบัญชีให้ครบ");
    ref = raw.slice(0, 80);
  }

  const btn = $("pSubmit");
  btn.disabled = true;
  const { error } = await sb.rpc("request_payout", { p_amount: amount, p_method: method, p_reference: ref });
  btn.disabled = false;
  if (error) { console.error(error); return err(friendly(error.message)); }

  closePayout();
  toast("ส่งคำขอรับเงินแล้ว");
  state.hseg = "payouts";
  try { await loadAll(); } catch (e) { console.error(e); }
  showTab("history");
}
async function cancelPayout(id) {
  if (!(await askConfirm("ยกเลิกคำขอรับเงินนี้?", "ยกเลิกคำขอ"))) return;
  const { error } = await sb.rpc("cancel_payout", { p_payout_id: id });
  if (error) { console.error(error); toast(friendly(error.message), true); return; }
  toast("ยกเลิกคำขอแล้ว");
  try { await loadAll(); } catch (e) { console.error(e); }
}

// ---------- boot ----------
function showPending() {
  showState(
    state.profile.picture_url ? h("img", { src: state.profile.picture_url, alt: "" }) : null,
    h("h2", { text: state.profile.display_name || "สวัสดี" }),
    h("p", { text: "บัญชี LINE นี้ยังไม่ได้ผูกกับบ้าน แจ้งชื่อ LINE ข้างบนกับเจ้าหน้าที่ แล้วกดตรวจสอบอีกครั้ง" }),
    h("button", { class: "btn", type: "button", text: "ตรวจสอบอีกครั้ง", onclick: start })
  );
}
async function start() {
  showState(h("p", { text: "กำลังเปิดกระเป๋า..." }));
  try {
    if (!state.user) {
      const user = await authenticate();
      if (!user) return;
      state.user = user;
    }
    await loadProfile();
    if (!state.profile.household_id) { showPending(); return; }
    await loadAll();
    showApp();
    showTab(T0 || initialTab() || state.tab);
  } catch (e) {
    console.error(e);
    if (e && e.code === "auth_expired") {
      showFail("ล็อกอินหมดอายุ", "เปิดผ่าน LINE ใหม่อีกครั้งเพื่อยืนยันตัวตน", "ล็อกอิน LINE ใหม่", relogin);
    } else {
      showFail("เปิดไม่สำเร็จ", e && e.message ? e.message : "", "ลองใหม่", start);
    }
  }
}

document.querySelectorAll(".tabbar button").forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });
$("btnRefresh").onclick = async () => {
  try { await loadAll(); toast("อัปเดตแล้ว"); } catch (e) { console.error(e); toast("อัปเดตไม่สำเร็จ", true); }
};
$("pMethod").onchange = syncMethod;
$("pAll").onclick = () => { $("pAmount").value = money(state.bal.available_balance).toFixed(2); };
$("pCancel").onclick = closePayout;
$("pSubmit").onclick = submitPayout;
$("sheet").addEventListener("click", (ev) => { if (ev.target === $("sheet")) closePayout(); });

start();
</script>
</body>
